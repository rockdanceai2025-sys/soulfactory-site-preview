<!--
  SOUL FACTORY 確認用ページのパスワード入力画面。
  公開用リポジトリ（soulfactory-site-preview）に index.html という名前でコピーして使う。
  同じ階層に site.bin（tools/build-encrypted.js の出力）を置くこと。
  書体は CLAUDE.md で承認済みの Knewave / Zen Kaku Gothic New（どちらも SIL OFL）のみ。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>SOUL FACTORY｜確認用ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Knewave&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy:  #004AAD;
    --navy-dark: #00337a;
    --earth: #004AAD;
    --earth-pale: #e8f0fb;
    --cream: #004AAD;
    --red:   #c0392b;
    --text-sub: #5b6475;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--cream);
    color: var(--navy-dark);
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    line-height: 1.8;
  }

  .card {
    width: 100%;
    max-width: 380px;
    padding: 40px 28px;
    background: #fff;
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 6px;
    box-shadow: 0 6px 28px rgba(0, 0, 0, .18);
    text-align: center;
  }

  .logo { width: 52px; height: 52px; margin: 0 auto 16px; display: block; }

  .mark {
    font-family: 'Knewave', system-ui, sans-serif;
    font-size: 22px !important;
    letter-spacing: .04em !important;
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--earth);
    margin-bottom: 12px;
  }

  h1 { font-size: 21px; font-weight: 500; margin-bottom: 6px; }

  .sub {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 28px;
  }

  label {
    display: block;
    font-size: 13px;
    text-align: left;
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px; /* 16px 未満だと iOS で拡大されるため */
    font-family: inherit;
    color: inherit;
    background: var(--cream);
    border: 1px solid rgba(0, 74, 173, .25);
    border-radius: 4px;
  }

  input:focus { outline: 2px solid var(--earth); outline-offset: 1px; }

  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: .1em;
    color: #fff;
    background: var(--navy);
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover { background: var(--navy-dark); }
  button:disabled { opacity: .55; cursor: default; }

  .msg {
    min-height: 22px;
    margin-top: 14px;
    font-size: 13px;
    color: var(--red);
  }

  .note {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(0, 74, 173, .12);
    font-size: 12px;
    color: #9a8f83;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="card">
  <p class="mark">#SOUL_FACTORY</p>
  <h1>SOUL FACTORY</h1>
  <p class="sub">確認用ページ</p>

  <form id="gate">
    <label for="pw">パスワード</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button type="submit" id="go">閲覧する</button>
  </form>

  <p class="msg" id="msg"></p>

  <p class="note">
    このページは制作物の確認用です。<br>
    パスワードは担当者よりお伝えしております。
  </p>
</div>

<script>
(function () {
  'use strict';

  var ITERATIONS = 250000;
  var KEY_STORE = 'soulfactory-preview-pw';

  var form = document.getElementById('gate');
  var input = document.getElementById('pw');
  var button = document.getElementById('go');
  var msg = document.getElementById('msg');

  function say(text, isError) {
    msg.textContent = text;
    msg.style.color = isError ? 'var(--red)' : 'var(--text-sub)';
  }

  // salt/iv を取り出して site.bin を復号する
  function decrypt(password, buffer) {
    var bytes = new Uint8Array(buffer);
    var salt = bytes.slice(0, 16);
    var iv = bytes.slice(16, 28);
    var body = bytes.slice(28);
    var enc = new TextEncoder();

    return crypto.subtle
      .importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
          base,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, body);
      });
  }

  // [4バイトの長さ][目次JSON][ファイル本体...] を分解する
  function unpack(plain) {
    var view = new DataView(plain);
    var manifestLength = view.getUint32(0);
    var bytes = new Uint8Array(plain);
    var manifest = JSON.parse(
      new TextDecoder().decode(bytes.slice(4, 4 + manifestLength))
    );

    var offset = 4 + manifestLength;
    var files = {};
    manifest.forEach(function (entry) {
      files[entry.name] = new Blob([bytes.slice(offset, offset + entry.len)], {
        type: entry.mime
      });
      offset += entry.len;
    });
    return files;
  }

  // 複数ページの切り替え（トップ ⇄ 下層ページ）。リンク先が同梱のページならその場で表示する
  var FILES = null;
  var current = 'index.html';

  function pageFor(href) {
    var u;
    try { u = new URL(href, 'https://preview.invalid/' + current); } catch (e) { return null; }
    if (u.host !== 'preview.invalid') return null;
    var name = u.pathname.replace(/^\//, '');
    if (name === '' || /\/$/.test(name)) name += 'index.html';
    return FILES[name] ? { name: name, hash: u.hash } : null;
  }

  function show(name, hash, push) {
    return FILES[name].text().then(function (html) {
      current = name;
      document.open();
      document.write(html);
      document.close();
      if (push) { try { history.pushState({ page: name }, '', '#!/' + name.replace(/index\.html$/, '')); } catch (e) {} }
      document.addEventListener('click', onClick, true);
      window.addEventListener('popstate', onPop);
      setTimeout(function () {
        var el = hash && document.getElementById(decodeURIComponent(hash.slice(1)));
        if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
      }, 50);
    });
  }

  function onClick(e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a || a.target === '_blank') return;
    var raw = a.getAttribute('href');
    if (!raw || raw.charAt(0) === '#') return;           // 同じページ内の移動はそのまま
    var t = pageFor(raw);
    if (!t) return;                                      // 外部サイトなどはそのまま
    e.preventDefault();
    if (t.name === current) {
      var el = t.hash && document.getElementById(t.hash.slice(1));
      if (el) el.scrollIntoView({ behavior: 'smooth' });
      return;
    }
    show(t.name, t.hash, true);
  }

  // ページを書き換えると登録した動きが消えるため、表示のたびに付け直す
  function onPop() {
    if (!FILES) return;
    var m = /^#!\/(.*)$/.exec(location.hash);
    var name = m ? (m[1] === '' || /\/$/.test(m[1]) ? m[1] + 'index.html' : m[1]) : 'index.html';
    if (FILES[name] && name !== current) show(name, '', false);
  }

  function render(files) {
    FILES = files;
    var m = /^#!\/(.*)$/.exec(location.hash);           // 再読み込みしたときは同じページを開く
    var start = m ? (m[1] === '' || /\/$/.test(m[1]) ? m[1] + 'index.html' : m[1]) : 'index.html';
    return show(FILES[start] ? start : 'index.html', '', false);
  }

  function unlock(password, isAuto) {
    button.disabled = true;
    say('読み込んでいます…', false);

    // 更新がすぐ見えるよう、毎回最新のデータを取りに行く（ブラウザの保存を使わない）
    return fetch('site.bin?v=' + Date.now(), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('fetch-failed');
        return res.arrayBuffer();
      })
      .then(function (buffer) {
        return decrypt(password, buffer);
      })
      .then(function (plain) {
        // 復号できた＝パスワードが正しい。次回以降は自動で開く
        try { sessionStorage.setItem(KEY_STORE, password); } catch (e) {}
        return render(unpack(plain));
      })
      .catch(function (err) {
        try { sessionStorage.removeItem(KEY_STORE); } catch (e) {}
        button.disabled = false;
        if (err && err.message === 'fetch-failed') {
          say('データを読み込めませんでした。通信環境をご確認ください。', true);
        } else if (isAuto) {
          say('', false);
        } else {
          say('パスワードが違います。', true);
          input.select();
        }
      });
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (!input.value) return;
    unlock(input.value, false);
  });

  if (!window.crypto || !crypto.subtle) {
    say('お使いのブラウザでは表示できません。Chrome・Safari の最新版でお試しください。', true);
    button.disabled = true;
  } else {
    // 同じタブで開き直したときはパスワード入力を省略する
    var saved = null;
    try { saved = sessionStorage.getItem(KEY_STORE); } catch (e) {}
    if (saved) unlock(saved, true);
  }
})();
</script>

</body>
</html>
